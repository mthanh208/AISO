<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UACB Extension</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
        }
        .status {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-dot.connected {
            background: #4caf50;
        }
        .status-dot.disconnected {
            background: #f44336;
        }
        .status-text {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background: #2196f3;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover {
            background: #1976d2;
        }
        button.secondary {
            background: #757575;
        }
        button.secondary:hover {
            background: #616161;
        }
        .info {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        #projectSelect {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>🌉 UACB Extension</h2>
    
    <div class="status">
        <div class="status-dot disconnected" id="statusDot"></div>
        <span class="status-text" id="statusText">Checking...</span>
    </div>

    <select id="projectSelect">
        <option value="">Select Project...</option>
    </select>

    <button id="refreshBtn">Refresh Projects</button>
    <button id="resetBtn" class="secondary">Reset Session</button>

    <div class="info">
        <strong>How to use:</strong><br>
        1. Make sure bridge is running<br>
        2. Select a project<br>
        3. Open ChatGPT/Claude/Gemini<br>
        4. AI will auto-detect tool calls
    </div>

    <script src="popup.js"></script>
</body>
</html>
